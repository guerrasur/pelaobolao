<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#192d27" />
    <meta name="description" content="Pelao Bolao: un juego de soplos, bancos y decisiones secretas. De 2 a 6 jugadores." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Pelao Bolao" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <title>Pelao Bolao</title>
  </head>
  <body>
    <header><a class="brand" href="/" aria-label="Pelao Bolao"><span>PELAO</span><span>BOLAO</span></a><button id="sound-toggle" type="button" aria-pressed="true" aria-label="Silenciar sonido" title="Silenciar sonido"><svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"></path><path d="M16 9.5c1.3 1.3 1.3 3.7 0 5"></path><path d="M18.6 7c2.8 2.8 2.8 7.2 0 10"></path></svg><svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"></path><path d="m16.5 9 5 6"></path><path d="m21.5 9-5 6"></path></svg></button><span id="app-meta">2–6</span></header>
    <p id="connection" role="status">Conectando…</p>
    <main id="app"><p>Preparando tu jugador…</p></main>
    <p id="notice" role="status" aria-live="polite"></p>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}), { once: true });
      }
    </script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/entrance.js"></script>
    <script type="module" src="/src/condor.js"></script>
    <script type="module" src="/src/condor20.js"></script>
  </body>
</html>
