name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main # Asegúrate de colocar tu rama principal aquí (ej: main o master)
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build # Elimina esta línea si tu web es de archivos estáticos puros (HTML/CSS/JS) sin compilación
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PELAOBOLAO }}"
          projectId: pelaobolao
          channelId: live
